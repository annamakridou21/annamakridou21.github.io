<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AAM / dataLayer / consent test</title>
  <!--
    Research page: pixel with NO custom identify() code.
    Goal: prove TikTok's Auto Advanced Matching scrapes PII on its own.

    How to use (DevTools Network tab, filter "analytics.tiktok.com"):
      1. Type an email + phone in the form below, then click "Place Order".
         -> Watch the pixel POST bodies for  auto_email / auto_phone_number  hashes.
      2. Click "Push email to dataLayer".
         -> Watch for  eb_email  and an  acp  entry with source "aam_dl_raw_em".
      3. Use the consent buttons, then fire any event.
         -> disableCookie() should stop cookies but NOT the PII hashes.
         -> holdConsent() should stop events entirely until grantConsent().
  -->
  <script>
  !function (w, d, t) {
    w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=["page","track","identify","instances","debug","on","off","once","ready","alias","group","enableCookie","disableCookie","holdConsent","revokeConsent","grantConsent"],ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(
  var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e},ttq.load=function(e,n){var r="https://analytics.tiktok.com/i18n/pixel/events.js",o=n&&n.partner;ttq._i=ttq._i||{},ttq._i[e]=[],ttq._i[e]._u=r,ttq._t=ttq._t||{},ttq._t[e]=+new Date,ttq._o=ttq._o||{},ttq._o[e]=n||{};n=document.createElement("script")

  </script>
</head>
<body>
  <h1>Auto-scrape test — no manual identify() on this page</h1>

  <h2>1. AAM input scraping (expect auto_email / auto_phone_number)</h2>
  <form id="fakeForm">
    <input type="email" name="email" id="email" autocomplete="email" placeholder="email"><br><br>
    <input type="tel" name="phone" id="phone" autocomplete="tel" placeholder="phone"><br><br>
    <button type="submit" name="checkout">Place Order</button>
  </form>

  <hr>

  <h2>2. dataLayer scraping (expect eb_email + acp source "aam_dl_raw_em")</h2>
  <button id="pushDlBtn">Push email to dataLayer</button>

  <hr>

  <h2>3. Consent / cookie controls</h2>
  <button id="disableCookieBtn">ttq.disableCookie()</button>
  <button id="enableCookieBtn">ttq.enableCookie()</button>
  <button id="holdConsentBtn">ttq.holdConsent()</button>
  <button id="grantConsentBtn">ttq.grantConsent()</button>
  <button id="firePageBtn">Fire a track event</button>

  <script>
    // 1. AAM: nothing to code — the pixel binds to button clicks and reads
    //    nearby inputs whose name/id match its selectors. Just fill + click.

    // 2. Simulate rarecarat's dataLayer push
    document.getElementById('pushDlBtn').addEventListener('click', function () {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: 'checkout', email: 'alalal@gmail.com', phone: '+306912345678' });
      ttq.track('ViewContent', { contents: [{ content_id: 'dl_test', content_type: 'product' }] });
    });

    // 3. Consent controls
    document.getElementById('disableCookieBtn').addEventListener('click', function () { ttq.disableCookie(); });
    document.getElementById('enableCookieBtn').addEventListener('click', function () { ttq.enableCookie(); });
    document.getElementById('holdConsentBtn').addEventListener('click', function () { ttq.holdConsent(); });
    document.getElementById('grantConsentBtn').addEventListener('click', function () { ttq.grantConsent(); });
    document.getElementById('firePageBtn').addEventListener('click', function () {
      ttq.track('ViewContent', { contents: [{ content_id: 'consent_test', content_type: 'product' }] });
    });
  </script>
</body>
</html>
