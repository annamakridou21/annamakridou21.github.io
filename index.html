    <button type="submit">Submit Data & Identify</button>

  <script>
    // --- Helper to hash and save PII ---
    function captureAndSavePII() {
      var identifyData = {};
      
      var rawFirstName = document.getElementById('firstNameInput').value.trim().toLowerCase();
      var rawLastName  = document.getElementById('lastNameInput').value.trim().toLowerCase();
      var rawEmail     = document.getElementById('emailInput').value.trim().toLowerCase();
      var rawPhone     = document.getElementById('phoneInput').value.trim();
      var rawAddress   = document.getElementById('addressInput').value.trim().toLowerCase();
      var rawExtId     = document.getElementById('externalIdInput').value.trim();
      
      if (rawFirstName) {
        identifyData.first_name = sha256(rawFirstName);
        localStorage.setItem('ttq_first_name', identifyData.first_name);
      }
      if (rawLastName) {
        identifyData.last_name = sha256(rawLastName);
        localStorage.setItem('ttq_last_name', identifyData.last_name);
      }
      if (rawEmail) {
        identifyData.email = sha256(rawEmail);
        localStorage.setItem('ttq_email', identifyData.email);
      }
      if (rawPhone) {
        identifyData.phone_number = sha256(rawPhone);
        localStorage.setItem('ttq_phone', identifyData.phone_number);
      }
      if (rawAddress) {
        identifyData.address = sha256(rawAddress);
        localStorage.setItem('ttq_address', identifyData.address);
      }
      if (rawExtId) {
        identifyData.external_id = sha256(rawExtId);
        localStorage.setItem('ttq_extid', identifyData.external_id);
      }
      
      return identifyData;
    }

    // --- Send PII on Blur (Clicking away from fields) ---
    var piiInputs = ['firstNameInput', 'lastNameInput', 'emailInput', 'phoneInput', 'addressInput', 'externalIdInput'];
    
    piiInputs.forEach(function(inputId) {
      document.getElementById(inputId).addEventListener('blur', function() {
        var identifyData = captureAndSavePII();
        if (Object.keys(identifyData).length > 0) {
          ttq.identify(identifyData);
          console.log("Updated PII saved and sent to TikTok on blur!");
        }
      });
    });

    // --- Form Submission ---
    document.getElementById('trackingForm').addEventListener('submit', function(event) {
      event.preventDefault(); 
      
      var identifyData = captureAndSavePII();
      if (Object.keys(identifyData).length > 0) {
        ttq.identify(identifyData);
        alert("Manual Identify Data Saved and Sent!");
      } else {
        alert("No PII data to send.");
      }
    });

    // --- Fire All Events Button ---
    document.getElementById('fireAllEventsBtn').addEventListener('click', function() {
