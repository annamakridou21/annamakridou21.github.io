  <h2>User Information</h2>
  <form id="trackingForm">
    <label for="emailInput">Email:</label><br>
    <input type="email" id="emailInput" name="email"><br><br>
    <label for="phoneInput">Phone Number:</label><br>
    <input type="tel" id="phoneInput" name="phone_number"><br><br>
    <label for="nameInput">Name:</label><br>
    <input type="text" id="nameInput" name="name"><br><br>
    <label for="addressInput">Address:</label><br>
    <input type="text" id="addressInput" name="address"><br><br>
    <label for="externalIdInput">Customer ID:</label><br>
    <input type="text" id="externalIdInput" name="external_id"><br><br>
    <button type="submit">Submit Data & Identify</button>
  </form>
  
  <script>
    // --- Form Submission ---
    document.getElementById('trackingForm').addEventListener('submit', function(event) {
      event.preventDefault(); 
      
      var rawEmail = document.getElementById('emailInput').value.trim().toLowerCase();
      var rawPhone = document.getElementById('phoneInput').value.trim();
      var rawExtId = document.getElementById('externalIdInput').value.trim();
      
      var identifyData = {};
      if (rawEmail) identifyData.email = sha256(rawEmail);
      if (rawPhone) identifyData.phone_number = sha256(rawPhone);
      if (rawExtId) identifyData.external_id = sha256(rawExtId);
      
      ttq.identify(identifyData);
      alert("Manual Identify Data Sent!");
    });

    // --- Fire All Events Button ---
    document.getElementById('fireAllEventsBtn').addEventListener('click', function() {
