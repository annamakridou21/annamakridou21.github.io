  <h1>Welcome to my website</h1>
  
  <!-- Email Form Starts Here -->
  <h2>Subscribe for updates</h2>
  <form id="emailForm">
    <label for="emailInput">Enter your email address:</label><br><br>
    
    <!-- 
      For AUTOMATIC Advanced Matching, standard types and names like "email" 
      allow the TikTok Pixel to recognize the field on its own. 
    -->
    <input type="email" id="emailInput" name="email" required placeholder="you@example.com">
    <button type="submit">Submit</button>
  </form>

  <!-- Script to handle form submission and Manual Advanced Matching -->
  <script>
    document.getElementById('emailForm').addEventListener('submit', function(event) {
      // Prevents the page from reloading immediately so the pixel has time to fire
      event.preventDefault(); 
      
      // 1. Get the email the user typed, remove spaces, and make lowercase
      var rawEmail = document.getElementById('emailInput').value.trim().toLowerCase();
      
      // 2. Hash the email using SHA-256 (Required for client-side Manual Matching)
      var hashedEmail = sha256(rawEmail);

      // 3. Send the hashed email to TikTok via Identify
      ttq.identify({
        "email": hashedEmail 
      });

      // 4. Fire your tracking event (e.g., 'Search', 'CompleteRegistration', etc.)
      ttq.track('Search', {
        "contents": [
          {
            "content_id": "1077218", 
            "content_type": "product", 
            "content_name": "shirt", 
            "content_category": "apparel", 
            "price": 25, 
            "num_items": 1, 
            "brand": "Nike" 
          }
        ],
        "value": 25, 
        "currency": "USD", 
        "search_string": "SAVE10COUPON", 
        "status": "submitted" 
      });

      // Optional: Give the user feedback or redirect them
      alert("Email submitted and tracked!");
    });
